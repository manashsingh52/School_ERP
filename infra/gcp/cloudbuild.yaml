# Builds and pushes the three images in Google Cloud (no Docker needed on your machine).
#   gcloud builds submit --config infra/gcp/cloudbuild.yaml --substitutions=_IMAGE_BASE=…,_TAG=…
options:
  machineType: E2_HIGHCPU_8
  env: ['DOCKER_BUILDKIT=1']
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
steps:
  - id: api
    name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'apps/api/Dockerfile', '--target', 'api', '-t', '${_IMAGE_BASE}/api:${_TAG}', '.']
  - id: migrate
    name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'apps/api/Dockerfile', '--target', 'migrate', '-t', '${_IMAGE_BASE}/migrate:${_TAG}', '.']
  - id: web
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: ['build', '-f', 'apps/web/Dockerfile', '-t', '${_IMAGE_BASE}/web:${_TAG}', '.']
images:
  - '${_IMAGE_BASE}/api:${_TAG}'
  - '${_IMAGE_BASE}/migrate:${_TAG}'
  - '${_IMAGE_BASE}/web:${_TAG}'
