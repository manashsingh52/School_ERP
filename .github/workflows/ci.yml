name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # openapi.json must be regenerated when contracts change
      - run: pnpm --filter @schoolos/contracts openapi && git diff --exit-code packages/contracts/openapi.json
      # Type checks for every package (generates the Prisma client first)
      - run: pnpm typecheck
      # Unit + integration tests. The API suite boots a real PostgreSQL 17 (embedded-postgres)
      # and runs the tenant-isolation and RLS tests against it — no service container needed.
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  # Browser tests of the critical paths (apps/e2e): real PostgreSQL + RLS, the built API and web
  # app, demo seed. Sign-in, attendance, counter and online fees, marks, admissions, console.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @schoolos/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

  # Proves the deployment images build (docs/10). Nothing is pushed here; deploy.yml does that.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - { name: api, file: apps/api/Dockerfile, target: api }
          - { name: migrate, file: apps/api/Dockerfile, target: migrate }
          - { name: web, file: apps/web/Dockerfile, target: web }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          load: ${{ matrix.name != 'migrate' }}
          tags: schoolos-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Start the image and check it answers
        if: matrix.name == 'web'
        run: |
          docker run -d --name web -p 8080:8080 -e API_URL=http://127.0.0.1:9 -e APP_BASE_DOMAIN=localhost schoolos-web:ci
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:8080/login && exit 0; sleep 1; done
          docker logs web; exit 1
      - name: Chromium is present for PDFs
        if: matrix.name == 'api'
        run: docker run --rm --entrypoint chromium schoolos-api:ci --headless --no-sandbox --disable-gpu --dump-dom about:blank >/dev/null
