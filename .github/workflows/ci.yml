name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # openapi.json must be regenerated when contracts change
      - run: pnpm --filter @schoolos/contracts openapi && git diff --exit-code packages/contracts/openapi.json
      # Type checks for every package (generates the Prisma client first)
      - run: pnpm typecheck
      # Unit + integration tests. The API suite boots a real PostgreSQL 17 (embedded-postgres)
      # and runs the tenant-isolation and RLS tests against it — no service container needed.
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
