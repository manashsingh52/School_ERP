name: Android

# Builds the Play Store bundle (.aab) of the demo app: no server needed, sample school data
# (DEMO_MODE, see apps/mobile/README.md). Download it from the run's "Artifacts" and upload it in
# Play Console. Signed with the upload key from the repository secrets (docs/play-store/README.md);
# without them the bundle is signed with a debug key, which proves the build but Play refuses.
on:
  workflow_dispatch:
  push:
    paths: ['apps/mobile/**', '.github/workflows/android.yml']

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No upload key in the repository secrets. This bundle is signed with a debug key: Google Play will refuse it."
          fi
      # Every upload to Play needs a higher version code: the run number always grows.
      - run: flutter build appbundle --release --dart-define=DEMO_MODE=true --build-number=${{ github.run_number }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: schoolos-demo-${{ github.run_number }}
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
